# Number of PostgreSQL instances (1 = single, 3 = primary + 2 replicas with automatic failover)
instances: 1

storage:
  size: 1Gi
  # storageClass: ""   # empty = the cluster's default StorageClass

# Database and owner created on first start
database: app
owner: app

# PostgreSQL settings (strings). shared_buffers ~ 1/4 of the memory limit.
postgresql:
  parameters:
    shared_buffers: 256MB

# Sized from the Oct 2026 benchmark: 50m CPU / 256Mi was too small
# (+50% TPS with 500m; RAM was at 96% of 256Mi).
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 1Gi
